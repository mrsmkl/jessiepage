<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JessiePage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
  <style>
:root {
  color-scheme: light dark;
  --panel: light-dark(#f6f7f9, #18191d);
  --panel2: light-dark(#fff, #111216);
  --border: light-dark(#d9dce2, #30333a);
  --muted: light-dark(#6c717c, #9da3af);
  --text: light-dark(#17191e, #eceef2);
  --accent: light-dark(#2563eb, #7da3ff);
  --error: light-dark(#c52a1d, #ff8a80);
  --errorbg: light-dark(rgb(197 42 29 / .10), rgb(255 138 128 / .13));
  --editor-width: 40vw;
  --editor-height: 46vh;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--panel2); color: var(--text); font-family: Inter, system-ui, sans-serif; }
main { width: 100vw; height: 100dvh; display: grid; grid-template-columns: minmax(0, var(--editor-width)) 7px minmax(0, 1fr); }
.editor-pane { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto minmax(0,1fr) auto auto; background: var(--panel); }
.topline { height: 43px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-bottom: 1px solid var(--border); overflow: hidden; user-select: none; }
.brand { flex: 0 0 auto; font-size: 13px; font-weight: 680; }
#page-select, #page-name { height: 28px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel2); color: var(--text); font: 12px system-ui, sans-serif; outline: none; }
#page-select { width: 92px; min-width: 70px; padding: 0 22px 0 7px; }
#page-name { width: 130px; min-width: 70px; padding: 0 8px; }
#page-select:focus, #page-name:focus { border-color: var(--accent); }
.icon-button { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; padding: 0; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--muted); font: 18px/1 system-ui, sans-serif; cursor: pointer; }
.fullscreen-button { display: none; }
.top-link { flex: 0 0 auto; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; white-space: nowrap; }
.top-link:hover { color: var(--accent); text-decoration: underline; }
#status { margin-left: auto; max-width: 32%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 11px ui-monospace, monospace; }
#status.pending { color: var(--accent); }
#status.error { color: var(--error); }
.editor-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.source-editor { position: absolute; inset: 0; min-width: 0; min-height: 0; overflow: hidden; }
#error-line-marker { position: absolute; z-index: 0; left: 0; right: 0; display: none; background: var(--errorbg); border-left: 3px solid var(--error); pointer-events: none; }
textarea { position: relative; z-index: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; resize: none; border: 0; outline: 0; padding: 16px 17px 24px; background: transparent; color: var(--text); caret-color: var(--accent); font: 14px/2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
.cas-results { position: absolute; z-index: 2; inset: 0 10px; min-width: 0; min-height: 0; overflow: hidden; pointer-events: none; }
.cas-result-lines { width: 100%; min-width: 0; padding: 16px 0 24px; }
.cas-result-line { height: var(--cas-line-height, 28px); display: flex; justify-content: flex-end; align-items: center; color: var(--text); white-space: nowrap; font-size: 15px; }
.cas-result-bubble { position: relative; max-width: min(48%, 360px); min-height: 25px; display: inline-flex; align-items: center; gap: 7px; padding: 1px 7px; border: 1px solid color-mix(in srgb, var(--border) 72%, transparent); border-radius: 6px; background: color-mix(in srgb, var(--panel2) 88%, transparent); box-shadow: 0 1px 4px rgb(0 0 0 / .08); pointer-events: auto; }
.cas-result-bubble::before { content: ""; position: absolute; top: 50%; right: 100%; width: var(--connector-width, 12px); border-top: 1px solid color-mix(in srgb, var(--muted) 32%, transparent); }
.cas-formula { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
.cas-formula .katex { font-size: 1em; }
.cas-result-line.cas-error { color: var(--error); font: 11px/1.2 ui-monospace, monospace; }
.cas-result-line.cas-error .cas-result-bubble { border-color: color-mix(in srgb, var(--error) 32%, transparent); background: color-mix(in srgb, var(--errorbg) 88%, transparent); }
.graph-toggle { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font: 11px/1 system-ui, sans-serif; cursor: pointer; user-select: none; }
.graph-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.graph-switch { width: 21px; height: 12px; padding: 2px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 35%, transparent); transition: background .15s ease; }
.graph-switch::after { content: ""; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--panel2); box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s ease; }
.graph-toggle input:checked + .graph-switch { background: var(--accent); }
.graph-toggle input:checked + .graph-switch::after { transform: translateX(9px); }
.graph-toggle input:focus-visible + .graph-switch { outline: 2px solid var(--accent); outline-offset: 2px; }
.autocomplete { position: absolute; z-index: 10; left: 12px; bottom: 8px; width: min(290px, calc(100% - 24px)); max-height: 190px; overflow: auto; display: none; padding: 4px; border: 1px solid var(--border); border-radius: 9px; background: color-mix(in srgb, var(--panel2) 96%, transparent); box-shadow: 0 5px 18px rgb(0 0 0 / .16); }
.autocomplete.visible { display: block; }
.autocomplete-item { width: 100%; min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
.autocomplete-item.selected { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.autocomplete-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 12px ui-monospace, monospace; }
.autocomplete-kind { margin-left: auto; color: var(--muted); font-size: 10px; }
.hint { min-height: 30px; padding: 7px 13px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; line-height: 1.35; user-select: none; }
.hint.error { color: var(--error); background: var(--errorbg); }
.point-readback { max-height: 128px; overflow: auto; padding: 8px 13px 10px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--panel2) 45%, transparent); }
.point-readback .label { margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
#points { margin: 0; color: var(--muted); font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
.splitter { position: relative; z-index: 5; cursor: col-resize; background: var(--border); touch-action: none; }
.splitter::after { content: ""; position: absolute; inset: 0 -5px; }
.splitter:hover, .splitter.dragging { background: var(--accent); }
.board-pane { position: relative; min-width: 0; min-height: 0; padding: 12px; background: var(--panel2); }
.board-pane:fullscreen, .board-pane:-webkit-full-screen { width: 100%; height: 100%; padding: 8px; }
#board { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; cursor: grab; touch-action: none; overscroll-behavior: contain; }
#board:active { cursor: grabbing; }
.canvas-tools { position: absolute; right: 20px; bottom: 20px; z-index: 20; display: flex; gap: 7px; }
.canvas-tool { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid rgb(0 0 0 / .16); border-radius: 10px; background: rgb(255 255 255 / .94); color: #222; box-shadow: 0 1px 4px rgb(0 0 0 / .14); font: 600 22px/1 system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
.canvas-tool.reset { width: 60px; font-size: 13px; }
.canvas-tool.fullscreen { font-size: 21px; }
#validator { position: fixed; left: -10000px; top: -10000px; width: 400px; height: 400px; opacity: 0; pointer-events: none; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(43px, var(--editor-height)) 7px minmax(0,1fr); }
  .editor-pane { grid-template-rows: auto minmax(0,1fr) auto; }
  .brand { display: none; }
  #page-select { width: 70px; min-width: 62px; }
  #page-name { flex: 1 1 auto; width: auto; min-width: 58px; }
  #status:not(.error) { display: none; }
  #status.error { margin-left: 0; max-width: 46px; }
  .fullscreen-button { display: grid; }
  .top-link { font-size: 10px; }
  textarea { padding-left: 12px; padding-right: 12px; font-size: 13px; }
  .cas-results { inset-inline: 6px; }
  .cas-result-line { gap: 4px; font-size: 14px; }
  .cas-result-bubble { max-width: min(62%, 300px); gap: 4px; padding-inline: 5px; }
  .cas-formula { max-width: 130px; }
  .graph-toggle { font-size: 10px; }
  .hint:not(.error), .point-readback { display: none; }
  .splitter { cursor: row-resize; }
  .splitter::after { inset: -5px 0; }
  .board-pane { padding: 8px; }
  #board { border-radius: 8px; }
  .canvas-tools { right: 16px; bottom: 16px; gap: 8px; }
  .canvas-tool { width: 48px; height: 48px; border-radius: 12px; font-size: 26px; }
  .canvas-tool.reset { width: 64px; font-size: 14px; }
  .canvas-tool.fullscreen { font-size: 23px; }
  .autocomplete-item { min-height: 40px; }
}
  </style>
</head>
<body>
  <main id="layout">
    <section class="editor-pane">
      <div class="topline">
        <div class="brand">JessiePage</div>
        <select id="page-select" aria-label="Switch page"></select>
        <input id="page-name" type="text" maxlength="60" aria-label="Page name" title="Edit page name" />
        <button id="add-page" class="icon-button" title="New page" aria-label="New page">+</button>
        <button id="fullscreen-button" class="icon-button fullscreen-button" title="Enter fullscreen" aria-label="Enter fullscreen">⛶</button>
        <a id="program-link" class="top-link" href="#" target="_blank" rel="noopener noreferrer" title="Open this program as a new graph">Link ↗</a>
        <a class="top-link" href="https://jsxgraph.org/docs/symbols/JXG.JessieCode.html" target="_blank" rel="noopener noreferrer">Jessie ↗</a>
        <div id="status">loading…</div>
      </div>
      <div class="editor-wrap">
        <div class="source-editor">
          <div id="error-line-marker" aria-hidden="true"></div>
          <textarea id="editor" wrap="off" spellcheck="false" aria-label="JessieCode and CAS editor"></textarea>
          <div id="autocomplete" class="autocomplete" role="listbox" aria-label="Autocomplete suggestions"></div>
        </div>
        <div id="cas-results" class="cas-results" aria-label="Live CAS results">
          <div id="cas-result-lines" class="cas-result-lines"></div>
        </div>
      </div>
      <div id="hint" class="hint">Autosaved locally · drag canvas to pan · use board controls or wheel/pinch to zoom · drag simple points to edit source</div>
      <div class="point-readback"><div class="label">Points</div><pre id="points">—</pre></div>
    </section>
    <div id="splitter" class="splitter" role="separator" aria-label="Resize editor and canvas"></div>
    <section class="board-pane" id="board-pane">
      <div id="board" class="jxgbox"></div>
      <div class="canvas-tools" aria-label="Canvas controls">
        <button id="canvas-zoom-in" class="canvas-tool" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="canvas-zoom-out" class="canvas-tool" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="canvas-reset" class="canvas-tool reset" title="Reset view" aria-label="Reset view">100%</button>
        <button id="canvas-fullscreen" class="canvas-tool fullscreen" title="Canvas fullscreen" aria-label="Canvas fullscreen">⛶</button>
      </div>
    </section>
  </main>
  <div id="validator" aria-hidden="true"></div>

  <script type="module">
import { ComputeEngine, compile } from 'https://cdn.jsdelivr.net/npm/@cortex-js/compute-engine@0.119.0/+esm';
import katex from 'https://cdn.jsdelivr.net/npm/katex@0.18.6/+esm';
const BUILTIN_EXAMPLES = [
  { key: 'basics', name: 'Example · Basics', bbox: [-6,6,6,-6], source: `// Free points, lines, polygon, midpoint and circle.
A = point(-3, -1);
B = point(3, -1);
C = point(0, 3);
AB = segment(A, B);
BC = line(B, C) << dash: 2 >>;
tri = polygon(A, B, C) << fillColor: '#dbeafe', fillOpacity: 0.35 >>;
M = midpoint(A, B);
c = circle(M, C) << strokeColor: '#7c3aed' >>;` },
  { key: 'intersections', name: 'Example · Intersections', bbox: [-6,6,6,-6], source: `A = point(-2, 0);
B = point(2, 0);
c1 = circle(A, 3) << fillOpacity: 0.06 >>;
c2 = circle(B, 3) << fillOpacity: 0.06 >>;
P = intersection(c1, c2, 0);
Q = intersection(c1, c2, 1);
segment(A, B);
segment(P, Q) << dash: 2 >>;` },
  { key: 'glider', name: 'Example · Glider + tangent', bbox: [-6,6,6,-6], source: `O = point(0, 0);
R = point(3, 0);
c = circle(O, R);
P = glider(0, 3, c);
t = tangent(P);
segment(O, P) << dash: 2 >>;` },
  { key: 'functions', name: 'Example · Function plots', bbox: [-6,6,6,-6], source: `f = functiongraph('sin(x)') << strokeWidth: 3 >>;
g = functiongraph('0.25*x^2 - 2') << strokeColor: '#d97706' >>;
h = functiongraph('2*cos(x/2)') << strokeColor: '#7c3aed', dash: 2 >>;` },
  { key: 'slider', name: 'Example · Slider + function', bbox: [-6,6,6,-6], source: `a = slider([-4, -4], [2, -4], [-2, 1, 2]) << name: 'a' >>;
f = functiongraph(map (x) -> V(a) * sin(x)) << strokeWidth: 3 >>;` },
  { key: 'cardioid', name: 'Example · Parametric cardioid', bbox: [-6,6,6,-6], source: `fx = map (t) -> 2 * (1 - cos(t)) * cos(t);
fy = map (t) -> 2 * (1 - cos(t)) * sin(t);
c = curve(fx, fy, 0, 2 * PI) << strokeWidth: 3 >>;` },
  { key: 'loop', name: 'Example · Programming', bbox: [-6,6,6,-6], source: `for (i = 0; i < 9; i = i + 1) {
  point(i - 4, 2 * sin(i)) << name: '', withLabel: false >>;
}` },
  { key: 'cas-simplify', name: 'CAS · Simplify', bbox: [-6,6,6,-6], source: `// Plain-text definitions share one CAS scope.
f = (x+1)^2 - (x^2+2*x)
simplify(f)
a = 5`, previousSourceHashes: ['1d7f987a1cd670bac95e763b619eda6f425fba8498c4de448ff09f978d3ad272', 'ad75b581ce876f9bfc051e6ccde0f02ad928850b95ca7aa163d61bd64668bb5f'] },
  { key: 'cas-expand', name: 'CAS · Expand', bbox: [-6,6,6,-6], source: `// Turn on either Graph switch to use the shared canvas.
f = (x+1)^3
expand(f)`, previousSourceHash: '929a7fdc2bf228e8e392ab46a664689608f05a855fd5e22f19fc58b90fcb7be4' },
  { key: 'cas-differentiate', name: 'CAS · Differentiate', bbox: [-8,8,8,-8], source: `// f is defined once and reused by the next line.
f = x^3 + 2*x^2 - x + 4
differentiate(f, x)`, previousSourceHashes: ['2238c1409676ca0c4996c03eb5bbe0b45ba515a682a3ee0a56da169e4a276743', '08decb0d564946f18722e0ad386d8e43011235d4cc59a6078e688fabe0fded3e'] },
  { key: 'cas-solve', name: 'CAS · Solve to points', bbox: [-6,6,6,-6], source: `// solve() uses the current definition and returns every solution.
f = x^2 - 4
solve(f, x)`, previousSourceHashes: ['550770f454f89141d5c196ad112534ace0cfa0f7eb55a32c74c1848324a02c4e', 'fafe34c1409b378eea49d313bd16ec0b28def2e27bb754988d9f8532b912c0f3', 'e7fb538bdff08b6985328e0602a98c4b85a53153ee9da0b3c632f2fb9ccc9e1b'] },
  { key: 'cas-points', name: 'CAS · Point set', bbox: [-6,6,6,-6], source: `// A set of coordinate pairs is graphed together.
samples = {(-3,2),(-1,-2),(1,3),(3,1)}
samples` },
  { key: 'cas-factor', name: 'CAS · Factor', bbox: [-5,8,5,-8], source: `// Factor a polynomial without redefining it.
f = x^3 - 6*x^2 + 11*x - 6
factor(f, x)` },
  { key: 'cas-together', name: 'CAS · Together', bbox: [-6,8,6,-8], source: `// Combine a sum of rational expressions.
f = 1/x + 1/(x+1)
together(f)` },
  { key: 'cas-evaluate', name: 'CAS · Evaluate exactly', bbox: [-6,6,6,-6], source: `// Exact arithmetic stays exact where possible.
a = 2^{10} - 1
evaluate(a)
evaluate(1/3 + 1/6)` },
  { key: 'cas-numeric', name: 'CAS · Numeric approximation', bbox: [-6,6,6,-6], source: `// The optional second argument controls precision.
r = 2^{1/2}
numeric(r)
numeric(r, 30)` },
  { key: 'cas-substitute', name: 'CAS · Substitute', bbox: [-6,8,6,-8], source: `// The result can be graphed as a point on f.
f = x^2 - 4
substitute(f, x, 3)
substitute(f, x, -2)` },
  { key: 'cas-integrate', name: 'CAS · Integrate', bbox: [-5,8,5,-8], source: `// Indefinite results are graphable; definite results are scalars.
f = x^2
integrate(f, x)
integrate(f, x, 0, 2)` },
  { key: 'cas-limit', name: 'CAS · Limit', bbox: [-6,6,6,-6], source: `// The removable hole has the limiting value 2.
f = (x^2 - 1)/(x - 1)
limit(f, x, 1)` },
  { key: 'cas-complex', name: 'CAS · Complex plane', bbox: [-7,7,7,-7], source: `// Complex results use (real, imaginary) on the shared graph.
z = 3 + 2*i
w = (1-i)*z
z
w` },
  { key: 'cas-elementary-functions', name: 'CAS · Elementary functions', bbox: [-7,7,7,-7], source: `// Definitions also work inside later sums and products.
f = cos(x)
g = e^x
f + g
f*g`, previousSourceHash: '30a6a37caec804fbaf70bd2057ab7c140bd5dd313529f5d090abe22ac7843106' },
  { key: 'cas-latex-input', name: 'CAS · LaTeX input', bbox: [-7,7,7,-7], source: `// Plain text and LaTeX-style expressions can be mixed.
f = \\frac{x^2}{2}
g = \\sin(x)
f + g
\\cos(x)` },
  { key: 'cas-sum', name: 'CAS · Finite sums', bbox: [-7,7,7,-7], source: `// Reuse a term, or enter sigma notation directly.
term = x^k
s = sum(term, k, 1, 4)
sum(k^2, k, 1, 10)
\\sum_{k=1}^{10} k` },
  { key: 'cas-product', name: 'CAS · Finite products', bbox: [-7,7,7,-7], source: `// A product with x remaining can use the shared graph.
term = x+k
p = product(term, k, 1, 3)
product(k, k, 1, 6)
\\prod_{k=1}^{6} k` },
  { key: 'cas-shared-variables', name: 'CAS + Jessie · Shared values', bbox: [-7,7,7,-7], source: `// Constant values are defined in both CortexJS and JessieCode.
scale = 2
offset = 1;
height = scale + offset
A = point(-scale, offset);
B = point(scale, height);
carrier = line(A, B);
solve(carrier, y)
c = circle(A, scale);
solve(c, y)
f = x^2 + height` },
  { key: 'cas-determinant', name: 'CAS · Matrix determinant', bbox: [-6,6,6,-6], source: `// Matrices render as results but are not mistaken for point sets.
A = [[1,2],[3,4]]
determinant(A)` },
  { key: 'cas-inverse', name: 'CAS · Matrix inverse', bbox: [-6,6,6,-6], source: `// Reuse one matrix definition.
A = [[1,2],[3,4]]
inverse(A)` },
  { key: 'cas-transpose', name: 'CAS · Matrix transpose', bbox: [-6,6,6,-6], source: `// Transpose rows and columns.
A = [[1,2,3],[4,5,6]]
transpose(A)` },
  { key: 'cas-eigenvalues', name: 'CAS · Matrix eigenvalues', bbox: [-6,6,6,-6], source: `// CortexJS computes the eigenvalues from the shared matrix.
A = [[2,1],[1,2]]
eigenvalues(A)` },
  { key: 'cas-range', name: 'CAS · Range', bbox: [-6,6,6,-6], source: `// range() includes the end value when the step reaches it.
ascending = range(-3, 3)
descending = range(3, -3, -2)` },
  { key: 'cas-sampled-points', name: 'CAS · Sampled points', bbox: [-6,8,6,-8], source: `// Sample a single function definition and graph all paired points together.
f = x^2 - 4
xs = range(-3, 3)
ys = map(f, xs)
samples = zip(xs, ys)` },
  { key: 'cas-assumptions', name: 'CAS · Assumptions', bbox: [-6,6,6,-6], source: `// Assumptions affect every later line until forget() clears them.
assume(x > 0)
simplify(\\sqrt{x^2})
forget(x)
simplify(\\sqrt{x^2})` }
];

// Standalone JessieCode diagrams, installed once as editable local pages.
BUILTIN_EXAMPLES.push(...[
  {
"key": "euclid-postulate-01",
"name": "Euclid · Postulate 1 · Join two points",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Postulate 1: Join two points\n// A straight segment can be drawn between any two points.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.1 onward.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-4, -1);\nB = point(4, 2);\nsegment(A,B) <<strokeWidth:3>>;\ntext(-9,-5,map () -> 'Length AB = '+round(100*dist(A,B))/100) <<display:'internal',fontSize:16>>;\ntext(-9,6,'Postulate 1: Join two points') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "77b9e79e675f770baf2010489ed5efb62f9b1e101e9d10d159a12ff43b5b458e"
  },
  {
"key": "euclid-postulate-02",
"name": "Euclid · Postulate 2 · Extend a straight segment",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Postulate 2: Extend a straight segment\n// A finite straight line can be extended continuously along the same straight line.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.2, I.5, I.16, I.20.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-3, 0);\nB = point(2, 1);\nline(A,B) <<strokeColor:'#99a4af',dash:2>>;\nsegment(A,B) <<strokeWidth:3>>;\nC=point(map () -> 2*X(B)-X(A), map () -> 2*Y(B)-Y(A));\nsegment(B,C) <<strokeWidth:3,strokeColor:'#b45b27'>>;\ntext(-9,-5,map () -> 'AB = '+round(100*dist(A,B))/100+'; BC = '+round(100*dist(B,C))/100+'. The direction is unchanged.') <<display:'internal',fontSize:16>>;\ntext(-9,6,'Postulate 2: Extend a straight segment') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "d27cfd6c6c55e7e31cc72c91ad68c786cf4af757e05ea9c43a4ab68506f742b3"

"source": "// Euclid Book I — Postulate 3: Draw a circle\n// A circle can be drawn with any center and distance.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.1–3, I.9–12, I.22.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nO = point(0, 0);\nA = point(3, 1);\nc=circle(O,A) <<strokeWidth:3>>;\nsegment(O,A) <<dash:2>>;\ntext(-9,-5,map () -> 'Center O; radius OA = '+round(100*dist(O,A))/100+'. Move either point.') <<display:'internal',fontSize:16>>;\ntext(-9,6,'Postulate 3: Draw a circle') <<display:'internal',fontSize:18>>;\n",

  {
"key": "euclid-postulate-04",
"name": "Euclid · Postulate 4 · All right angles are equal",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Postulate 4: All right angles are equal\n// All right angles are equal to one another, regardless of orientation or size.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.13–15, I.29, I.46–48.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-6, 0);\nB = point(-3, 0);\nC=point(map () -> X(A)-(Y(B)-Y(A)),map () -> Y(A)+X(B)-X(A));\nD = point(2, -1);\nE = point(4, 1);\nF=point(map () -> X(D)-1.2*(Y(E)-Y(D)),map () -> Y(D)+1.2*(X(E)-X(D)));\nsegment(A,B); segment(A,C);\nsegment(D,E); segment(D,F);\nangle(B,A,C) <<name:'90°',selection:'minor'>>;\nangle(E,D,F) <<name:'90°',selection:'minor'>>;\ntext(-9,-5,map () -> 'Angles BAC and EDF: '+round(10*deg(B,A,C))/10+'° and '+round(10*deg(E,D,F))/10+'°') <<display:'internal',fontSize:16>>;\ntext(-9,6,'Postulate 4: All right angles are equal') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "ea10cabecbb490ba3b444745a5fb6c1744b688269330d58ece30bb13f14f40bd"
  },
  {
"key": "euclid-postulate-05",
"name": "Euclid · Postulate 5 · The parallel postulate",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Postulate 5: The parallel postulate\n// If a transversal makes same-side interior angles sum to less than two right angles, the two lines meet on that side.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.29; then I.30–48 through parallel-line results.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-4, 3);\nB = point(0, 2);\nC = point(-4, -3);\nD = point(0, -2);\na=line(A,B); b=line(C,D);\nsegment(B,D) <<strokeColor:'#b45b27',strokeWidth:3>>;\nR=point(map () -> 2*X(B)-X(A),map () -> 2*Y(B)-Y(A)) <<visible:false>>;\nS=point(map () -> 2*X(D)-X(C),map () -> 2*Y(D)-Y(C)) <<visible:false>>;\nE=intersection(a,b,0) <<name:'E'>>;\nangle(R,B,D) <<name:'α',selection:'minor'>>;\nangle(B,D,S) <<name:'β',selection:'minor'>>;\ntext(-9,-4.5,map () -> 'α + β = '+round(10*(min(deg(R,B,D),360-deg(R,B,D))+min(deg(B,D,S),360-deg(B,D,S))))/10+'°') <<display:'internal',fontSize:16>>;\ntext(-9,-5.5,function(){return abs(min(deg(R,B,D),360-deg(R,B,D))+min(deg(B,D,S),360-deg(B,D,S))-180)<0.1 ? 'The lines are parallel.' : (min(deg(R,B,D),360-deg(R,B,D))+min(deg(B,D,S),360-deg(B,D,S))<180 ? 'The lines meet on the marked side.' : 'The lines meet on the opposite side.');}) <<display:'internal',fontSize:16>>;\n// Keep the marked rays on the right of transversal BD when exploring this case.\n// At a 180-degree sum the lines are parallel and E has no finite position.\ntext(-9,6,'Postulate 5: The parallel postulate') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "b1b14012c3319fd7d9c629154e03e8c1faf7d3932fdc1e64da98c9254ac85b8a"
  },
  {
"key": "euclid-common-notion-01",
"name": "Euclid · Common notion 1 · Equality to the same thing",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Common notion 1: Equality to the same thing\n// Magnitudes equal to the same magnitude are equal to one another.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.1: AC=AB and BC=AB imply AC=BC.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-4, 3);\nB = point(1, 3);\nC=point(-4,0) <<fixed:true>>;\nD=point(map () -> -4+dist(A,B),0);\nE=point(-4,-3) <<fixed:true>>;\nF=point(map () -> -4+dist(A,B),-3);\nsegment(A,B) <<strokeWidth:3>>;\nsegment(C,D) <<strokeWidth:3,strokeColor:'#b45b27'>>;\nsegment(E,F) <<strokeWidth:3,strokeColor:'#29917a'>>;\ntext(3,3,'c'); text(3,0,'a = c'); text(3,-3,'b = c');\ntext(-9,-5.5,map () -> 'c = '+round(100*dist(A,B))/100+'; a = '+round(100*dist(C,D))/100+'; b = '+round(100*dist(E,F))/100) <<display:'internal',fontSize:16>>;\n// AB represents c, CD represents a, EF represents b.\ntext(-9,6,'Common notion 1: Equality to the same thing') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "d9e97aacf86123c89dd85c7d5ed358ab2ca7c0b5624109ad193a0246b226fb0d"
  },
  {
"key": "euclid-common-notion-02",
"name": "Euclid · Common notion 2 · Add equals to equals",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Common notion 2: Add equals to equals\n// Adding equal magnitudes to equal magnitudes gives equal totals.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.2, I.13, I.32.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-6, 3);\nB = point(-2, 3);\nC = point(1, 3);\nsegment(A,B) <<strokeWidth:4>>;\nsegment(B,C) <<strokeWidth:4,strokeColor:'#b45b27'>>;\nD=point(-6,-1) <<fixed:true>>;\nE=point(map () -> -6+dist(A,B),-1);\nF=point(map () -> -6+dist(A,B)+dist(B,C),-1);\nG=point(-6,-3) <<fixed:true>>;\nH=point(map () -> -6+dist(A,B),-3);\nK=point(map () -> -6+dist(A,B)+dist(B,C),-3);\nsegment(D,E) <<strokeWidth:4>>; segment(E,F) <<strokeWidth:4,strokeColor:'#b45b27'>>;\nsegment(G,H) <<strokeWidth:4>>; segment(H,K) <<strokeWidth:4,strokeColor:'#b45b27'>>;\ntext(3,-1,'a + b'); text(3,-3,'a + b');\ntext(-9,-5.5,map () -> 'Each total = '+round(100*(dist(A,B)+dist(B,C)))/100+' ('+round(100*dist(A,B))/100+' + '+round(100*dist(B,C))/100+')') <<display:'internal',fontSize:16>>;\ntext(-9,6,'Common notion 2: Add equals to equals') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "a5795b2aaca7c08645ff919d984606d7ab5dc3095ef3898e4b8a752d5bca409b"
  },
  {
"key": "euclid-common-notion-03",
"name": "Euclid · Common notion 3 · Subtract equals from equals",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Common notion 3: Subtract equals from equals\n// Subtracting equal magnitudes from equal magnitudes leaves equal remainders.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.2, I.5, I.15, I.35, I.43.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-6, 3);\nB = point(-2, 3);\nC = point(1, 3);\nsegment(A,B) <<strokeWidth:4>>; segment(B,C) <<strokeWidth:4,strokeColor:'#b45b27'>>;\nD=point(-6,-1) <<fixed:true>>;\nE=point(map () -> -6+dist(A,B),-1);\nF=point(map () -> -6+dist(A,B)+dist(B,C),-1);\nG=point(-6,-3) <<fixed:true>>;\nH=point(map () -> -6+dist(A,B),-3);\nK=point(map () -> -6+dist(A,B)+dist(B,C),-3);\nsegment(D,E) <<strokeColor:'#aaa',dash:2>>; segment(E,F) <<strokeWidth:4,strokeColor:'#b45b27'>>;\nsegment(G,H) <<strokeColor:'#aaa',dash:2>>; segment(H,K) <<strokeWidth:4,strokeColor:'#b45b27'>>;\ntext(-9,-5.5,map () -> 'Remove '+round(100*dist(A,B))/100+' from '+round(100*(dist(A,B)+dist(B,C)))/100+': each remainder = '+round(100*dist(B,C))/100) <<display:'internal',fontSize:16>>;\ntext(-9,6,'Common notion 3: Subtract equals from equals') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "8964d0f7ffa63d583b3d180fddce0d8d907625c28cc50a743bc2f4677e8c9d11"
  },
  {
"key": "euclid-common-notion-04",
"name": "Euclid · Common notion 4 · Coincidence gives equality",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Common notion 4: Coincidence gives equality\n// Magnitudes that coincide under superposition are equal.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.4 superposition argument.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-6, -1);\nB = point(-3, -1);\nC = point(-5, 2);\nt=slider([-6,-4],[3,-4],[0,0,1]) <<name:'Superposition'>>;\nD=point(map () -> X(A)+7*(1-t.Value()),map () -> Y(A));\nE=point(map () -> X(B)+7*(1-t.Value()),map () -> Y(B));\nF=point(map () -> X(C)+7*(1-t.Value()),map () -> Y(C));\npolygon(A,B,C) <<fillColor:'#548abd',fillOpacity:0.3>>;\npolygon(D,E,F) <<fillColor:'#cf9945',fillOpacity:0.3>>;\ntext(-9,-5.5,function(){return abs(1-t.Value())<0.001 ? 'The triangles coincide, so corresponding parts are equal.' : 'Move Superposition to 1. Separation = '+round(100*7*(1-t.Value()))/100;}) <<display:'internal',fontSize:16>>;\ntext(-9,6,'Common notion 4: Coincidence gives equality') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "c2ac825f14af7e8652cfa1ee63a4cd3a96de77a839fdfa633f0b08efd92a0727"
  },
  {
"key": "euclid-common-notion-05",
"name": "Euclid · Common notion 5 · The whole exceeds a part",
"bbox": [
  -10,
  7,
  10,
  -7
],
"source": "// Euclid Book I — Common notion 5: The whole exceeds a part\n// A whole magnitude is greater than a proper part of it.\n// Illustrative model of an assumption, not a proof.\n// Used in: I.6, I.7, I.16, I.39–40.\n$board.setBoundingBox([-10, 7, 10, -7], true);\n\nA = point(-5, 0);\nB = point(5, 0);\nC=point(map () -> X(A)+0.6*(X(B)-X(A)),map () -> Y(A)+0.6*(Y(B)-Y(A)));\nsegment(A,B) <<strokeWidth:8,strokeColor:'#ddd'>>;\nsegment(A,C) <<strokeWidth:4,strokeColor:'#245ea6'>>;\nsegment(C,B) <<strokeWidth:4,strokeColor:'#b45b27'>>;\ntext(-9,-4,map () -> 'AB = '+round(100*dist(A,B))/100+'; AC = '+round(100*dist(A,C))/100+'; CB = '+round(100*dist(C,B))/100) <<display:'internal',fontSize:16>>;\ntext(-9,-5.5,function(){return dist(A,B)<0.001 ? 'Move A and B apart.' : 'AC is '+round(1000*dist(A,C)/dist(A,B))/10+'% of the whole AB.';}) <<display:'internal',fontSize:16>>;\ntext(-9,6,'Common notion 5: The whole exceeds a part') <<display:'internal',fontSize:18>>;\n",
"previousSourceHash": "f00a77c8191461279596fbc63a4a7eb9e92767868ef6df0c957dffa4641c7475"
  },
  {

"bbox": [

"source": "// I.1: Construct an equilateral triangle\n// Drag plain point assignments to update their coordinates in the editor.\n$board.setBoundingBox([-9, 9, 13, -9], true);\n\nA = point(-2, 0);\nB = point(2, 0);\nc1=circle(A,B) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\nc2=circle(B,A) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\nC=intersection(c1,c2,0) <<name:'C'>>;\npolygon(A,B,C) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\nangle(B,A,C) <<name:'60°', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\nangle(A,B,C) <<name:'60°', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\ntext(-8,8,'I.1') <<display:'internal',fontSize:20>>;\n",

  },
  {

"name": "Euclid I.2 · Transfer a segment to a given point",
"bbox": [

"source": "// I.2: Transfer a segment to a given point\n// Drag plain point assignments to update their coordinates in the editor.\n$board.setBoundingBox([-9, 9, 13, -9], true);\n\nA = point(-3, 0);\nB = point(0, 0);\nC = point(1, 2);\nsegment(B,C) <<strokeWidth:2, strokeColor:'#34465d'>>;\nc1=circle(A,B) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\nc2=circle(B,A) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\nD=intersection(c1,c2,0) <<name:'D'>>;\nG=point(map () -> X(D)+(1+dist(B,C)/dist(D,B))*(X(B)-X(D)),map () -> Y(D)+(1+dist(B,C)/dist(D,B))*(Y(B)-Y(D))) <<name:'G', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\ncircle(B,C) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\nsegment(D,G) <<strokeWidth:2, strokeColor:'#34465d'>>;\nL=point(map () -> X(D)+(dist(D,G)/dist(D,A))*(X(A)-X(D)),map () -> Y(D)+(dist(D,G)/dist(D,A))*(Y(A)-Y(D))) <<name:'L', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\ncircle(D,G) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\nsegment(D,L) <<strokeWidth:2, strokeColor:'#34465d'>>;\nsegment(A,L) <<strokeWidth:2, strokeColor:'#34465d'>>;\npolygon(D,A,B) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\ntext(-8,8,'I.2') <<display:'internal',fontSize:20>>;\n",
"previousSourceHash": "acb31cbc2dbc69cc7c3e74a125f8221b197ac2ed9b42c8afc0073f7eb18c6331"
  },
  {

"source": "// I.3: Cut the shorter length from the longer\n// Drag plain point assignments to update their coordinates in the editor.\n$board.setBoundingBox([-9, 9, 13, -9], true);\n\nA = point(-3, 1);\nB = point(3, 1);\nC = point(-3, -2);\nD = point(-1, -1);\nsegment(A,B) <<strokeWidth:2, strokeColor:'#34465d'>>;\nsegment(C,D) <<strokeWidth:2, strokeColor:'#34465d'>>;\nE=point(map () -> X(A)+(dist(C,D)/dist(A,B))*(X(B)-X(A)),map () -> Y(A)+(dist(C,D)/dist(A,B))*(Y(B)-Y(A))) <<name:'E', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\ncircle(A,map () -> dist(C,D)) <<dash:2>>;\nsegment(A,E) <<strokeWidth:2, strokeColor:'#34465d'>>;\ntext(-8,8,'I.3') <<display:'internal',fontSize:20>>;\n",

  {

"source": "// I.4: Side-angle-side congruence\n// Drag plain point assignments to update their coordinates in the editor.\n$board.setBoundingBox([-9, 9, 13, -9], true);\n\nA = point(-6, 0);\nB = point(-3, 0);\nC = point(-5, 3);\nD=point(map () -> X(A)+7,map () -> Y(A)+0) <<name:'D', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\nE=point(map () -> X(B)+7,map () -> Y(B)+0) <<name:'E', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\nF=point(map () -> X(C)+7,map () -> Y(C)+0) <<name:'F', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\npolygon(A,B,C) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\npolygon(D,E,F) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\nangle(B,A,C) <<name:'α', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\nangle(E,D,F) <<name:'α', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\ntext(-8,8,'I.4') <<display:'internal',fontSize:20>>;\n",
"previousSourceHash": "c5ca9ab5351b170ee6f067ed65f9c106a721caf908ee0819c72ac4eb36ba6236"
  },
  {

"source": "// I.5: Base angles of an isosceles triangle\n// Drag plain point assignments to update their coordinates in the editor.\n$board.setBoundingBox([-9, 9, 13, -9], true);\n\nB = point(-3, 0);\nC = point(3, 0);\nM=midpoint(B,C) <<name:'M'>>;\nl=perpendicular(line(B,C),M) <<dash:2>>;\nA = point(0, 4);\nA.glide(l);\npolygon(A,B,C) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\nD=point(map () -> X(A)+(1.4)*(X(B)-X(A)),map () -> Y(A)+(1.4)*(Y(B)-Y(A))) <<name:'D', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\nE=point(map () -> X(A)+(1.4)*(X(C)-X(A)),map () -> Y(A)+(1.4)*(Y(C)-Y(A))) <<name:'E', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\nsegment(B,D) <<strokeWidth:2, strokeColor:'#34465d'>>;\nsegment(C,E) <<strokeWidth:2, strokeColor:'#34465d'>>;\nangle(A,B,C) <<name:'α', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\nangle(B,C,A) <<name:'α', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\ntext(-8,8,'I.5') <<display:'internal',fontSize:20>>;\n",

  {

"source": "// I.6: Equal angles imply equal opposite sides\n// Drag plain point assignments to update their coordinates in the editor.\n$board.setBoundingBox([-9, 9, 13, -9], true);\n\nB = point(-3, 0);\nC = point(3, 0);\nM=midpoint(B,C) <<name:'M'>>;\nl=perpendicular(line(B,C),M) <<dash:2>>;\nA = point(0, 4);\nA.glide(l);\npolygon(A,B,C) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\nD=point(map () -> X(A)+(1.4)*(X(B)-X(A)),map () -> Y(A)+(1.4)*(Y(B)-Y(A))) <<name:'D', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\nE=point(map () -> X(A)+(1.4)*(X(C)-X(A)),map () -> Y(A)+(1.4)*(Y(C)-Y(A))) <<name:'E', size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\nsegment(B,D) <<strokeWidth:2, strokeColor:'#34465d'>>;\nsegment(C,E) <<strokeWidth:2, strokeColor:'#34465d'>>;\nangle(A,B,C) <<name:'α', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\nangle(B,C,A) <<name:'α', radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\ntext(-8,8,'I.6') <<display:'internal',fontSize:20>>;\n",
"previousSourceHash": "e98b3d5770ac4f456c9b7d2d1d700775416c9f1135c22c18a80b1f25d00fec7b"

  {
"key": "euclid-i-07",
"name": "Euclid I.7 · Uniqueness on the same side of a base",

  const definitions = new Map();
  const lines = source.split('\n');
  const results = [];
  const jessieLines = lines.slice();
  lines.forEach((line, lineIndex) => {
    const casSource = casSourceFromLine(line);
    if (casSource === null) {
      try { geometryDefinitionFromLine(line, engine, definitions); }
      catch { /* Dynamic Jessie constructions do not need a CAS representation. */ }
      return;
    }
    jessieLines[lineIndex] = '';
    try {
      const result = evaluateLine(casSource, engine, definitions, lineIndex);
      results.push(result);
      jessieLines[lineIndex] = result.jessieDefinition;
    }
    catch (error) {
      results.push({ lineIndex, key: `line:${lineIndex}`, error: error?.message || String(error), graph: null, forceGraph: false });
    }
  });
  return { source, lines, jessieSource: jessieLines.join('\n'), results };
}

function drawCasGraphs(board, results, enabledKeys, compileExpression) {
  const colors = ['#2563eb', '#d97706', '#7c3aed', '#0f8b6d', '#c2416c', '#475569'];
  let colorIndex = 0;
  results.forEach((result) => {
    if (!result.graph || (!result.forceGraph && !enabledKeys.has(result.key))) return;
    const color = colors[colorIndex % colors.length];
    colorIndex += 1;
    if (result.graph.kind === 'points') {
      result.graph.coordinates.forEach(([x, y], index) => board.create('point', [x, y], {
        name: result.graph.coordinates.length > 1 ? `${index + 1}` : '',
        size: 3,
        strokeColor: color,
        fillColor: result.graph.open ? '#fff' : color,
        fixed: true
      }));
      return;
    }
    const { expression, variable } = result.graph;
    let compiledRun = null;
    try {
      const compiled = compileExpression?.(expression);
      if (compiled?.success && typeof compiled.run === 'function') compiledRun = compiled.run;
    } catch { /* Fall back to symbolic substitution for unsupported expressions. */ }
    board.create('functiongraph', [(x) => {
      try {
        const value = compiledRun ? compiledRun({ [variable]: x }) : expression.subs({ [variable]: x }).N().valueOf();
        return typeof value === 'number' && Number.isFinite(value) ? value : NaN;
      } catch { return NaN; }
    }], { strokeColor: color, strokeWidth: 3 });
  });
}
const NUMBER = String.raw`[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?`;

function formatNumber(value) {
  const clean = Math.abs(value) < 1e-12 ? 0 : value;
  return Number(clean.toFixed(6)).toString();
}

function escapeRegex(value) {
  return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function simplePointNames(code) {
  const names = new Set();
  const assignment = new RegExp(String.raw`^\s*([A-Za-z_$][\w$]*)\s*=\s*point\s*\(\s*${NUMBER}\s*,\s*${NUMBER}\s*\)\s*;?(?:\s*\/\/.*)?\s*$`);
  for (const line of code.split('\n')) {
    const match = line.match(assignment);
    if (match) names.add(match[1]);
  }
  return names;
}

function replaceSimplePointCoordinates(code, name, x, y) {
  const escapedName = escapeRegex(name);
  const assignment = new RegExp(String.raw`^(\s*${escapedName}\s*=\s*point\s*\(\s*)(${NUMBER})(\s*,\s*)(${NUMBER})(\s*\)\s*;?(?:\s*\/\/.*)?\s*)$`);
  const lines = code.split('\n');
  const index = lines.findIndex((line) => assignment.test(line));
  if (index < 0) return null;
  const match = lines[index].match(assignment);
  lines[index] = match[1] + formatNumber(x) + match[3] + formatNumber(y) + match[5];
  return lines.join('\n');
}

function simpleTextPositions(code) {
  const positions = [];
  const literal = new RegExp(String.raw`^(\s*(?:[A-Za-z_$][\w$]*\s*=\s*)?text\s*\(\s*)(${NUMBER})(\s*,\s*)(${NUMBER})(\s*,.*)$`);
  let objectIndex = 0;
  code.split('\n').forEach((line, lineIndex) => {
    const calls = line.match(/(?:^|;)\s*(?:[A-Za-z_$][\w$]*\s*=\s*)?text\s*\(/g) || [];
    if (calls.length === 1 && literal.test(line)) positions.push({ lineIndex, objectIndex });
    objectIndex += calls.length;
  });
  return positions;
}

function replaceSimpleTextCoordinates(code, lineIndex, x, y) {
  const literal = new RegExp(String.raw`^(\s*(?:[A-Za-z_$][\w$]*\s*=\s*)?text\s*\(\s*)(${NUMBER})(\s*,\s*)(${NUMBER})(\s*,.*)$`);
  const lines = code.split('\n');
  const match = lines[lineIndex]?.match(literal);
  if (!match) return null;
  lines[lineIndex] = match[1] + formatNumber(x) + match[3] + formatNumber(y) + match[5];
  return lines.join('\n');
}

const computeEngine = new ComputeEngine();

function toJessieExpression(json) {
  if (typeof json === 'number') return String(json);
  if (typeof json === 'string') return json;
  if (!Array.isArray(json) || !json.length) throw new Error('Unsupported CAS result');
  const [operator, ...operands] = json;
  const values = operands.map(toJessieExpression);
  switch (operator) {
    case 'Add': return `(${values.join('+')})`;
    case 'Multiply': return `(${values.join('*')})`;
    case 'Power': return `(${values[0]}^${values[1]})`;
    case 'Divide':
    case 'Rational': return `(${values[0]}/${values[1]})`;
    case 'Negate': return `(-${values[0]})`;
    case 'Sqrt': return `sqrt(${values[0]})`;
    default: return `${String(operator).toLowerCase()}(${values.join(',')})`;
  }
}

// CortexJS helpers exposed as ordinary JessieCode functions.
JXG.JessieCode.prototype.addBuiltIn('simplify', (source) =>
  toJessieExpression(computeEngine.parse(String(source)).simplify().json)
);
JXG.JessieCode.prototype.addBuiltIn('expand', (source) => {
  const expression = computeEngine.parse(String(source));
  return toJessieExpression(computeEngine.box(['Expand', expression]).evaluate().json);
});
JXG.JessieCode.prototype.addBuiltIn('differentiate', (source, variable) => {
  const expression = computeEngine.parse(String(source));
  return toJessieExpression(computeEngine.box(['D', expression, variable || 'x']).evaluate().json);
});
JXG.JessieCode.prototype.addBuiltIn('solve', (source, variable) =>
  computeEngine.parse(String(source)).solve(variable || 'x').map((solution) => {
    const value = solution.N().valueOf();
    return typeof value === 'number' ? value : solution.latex;
  })
);
JXG.JessieCode.prototype.addBuiltIn('points', function (coordinates, prefix) {
  if (!Array.isArray(coordinates)) throw new Error('points() expects an array of values or [x, y] coordinates');
  const namePrefix = prefix == null ? 'P' : String(prefix);
  return coordinates.map((item, index) => {
    const coordinate = Array.isArray(item) ? item : [item, 0];
    if (!Array.isArray(item) && !Number.isFinite(item)) return null;
    if (!Array.isArray(coordinate) || coordinate.length < 2) {
      throw new Error('Each points() coordinate must be [x, y]');
    }
    return this.board.create('point', [coordinate[0], coordinate[1]], {
      name: namePrefix ? `${namePrefix}${index + 1}` : ''
    });
  }).filter(Boolean);
});

function saveState() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (err) { console.warn(err); setStatus('error', 'local save failed'); }

function queueSaveState() {
  clearTimeout(saveTimer);

    updateProgramLink();

}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.pages) || !parsed.pages.length) return false;
    state = parsed;
    if (!state.pages.some((p) => p.id === state.currentPageId)) state.currentPageId = state.pages[0].id;

function linkedPageFromHash() {

  const page = makePage((params.get('name') || 'Linked graph').slice(0, 60), params.get('code') || '');

function expandedTabs(source, size = 2) {

    if (character !== '\t') { result += character; column += 1; continue; }

}

function validateAllBuiltinPages() {
  const failures = [];
  for (const example of BUILTIN_EXAMPLES) {
    try {
      const analysis = analyzeSource(example.source, ComputeEngine);
      const casErrors = analysis.results.filter((result) => result.error);
      if (casErrors.length) throw new Error(casErrors.map((result) => result.error).join('; '));
      validate(analysis.jessieSource);
    } catch (error) { failures.push(`${example.key}: ${error?.message || error}`); }
  }
  document.documentElement.dataset.builtinValidation = failures.length ? 'failed' : 'ok';
  document.documentElement.dataset.builtinCount = String(BUILTIN_EXAMPLES.length);
  if (failures.length) {
    document.documentElement.dataset.builtinFailures = failures.join(' | ');
    console.error('Built-in validation failed', failures);
  }
}

async function installBuiltinExamples(selectBasics = false) {
  if ((state.builtinExamplesVersion || 0) >= BUILTIN_EXAMPLES_VERSION) return;
  const existing = new Set(state.pages.map((p) => p.builtinKey).filter(Boolean));
  let basicsId = null;
  for (const example of BUILTIN_EXAMPLES) {
    if (existing.has(example.key)) {
      const page = state.pages.find((p) => p.builtinKey === example.key);
      // Upgrade only pristine earlier built-in examples. Preserve edited pages.
      const previousHashes = example.previousSourceHashes || (example.previousSourceHash ? [example.previousSourceHash] : []);
      if (previousHashes.length && page.source === page.lastGoodSource && globalThis.crypto?.subtle) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(page.source));
        const hash = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
        if (previousHashes.includes(hash)) {
          try {
            validate(analyzeSource(example.source, ComputeEngine).jessieSource);
            page.source = example.source;
            page.lastGoodSource = example.source;
          } catch (err) { console.warn(`Keeping previous example ${example.key}`, err); }
        }
      }
      continue;
    }
    try {
      validate(analyzeSource(example.source, ComputeEngine).jessieSource);
      const page = makePage(example.name, example.source);
      page.builtinKey = example.key;
      page.bbox = example.bbox.slice();
      state.pages.push(page);
      if (example.key === 'basics') basicsId = page.id;
    } catch (err) { console.warn(`Skipping invalid built-in example ${example.key}`, err); }
  }
  state.builtinExamplesVersion = BUILTIN_EXAMPLES_VERSION;
  if (selectBasics && basicsId) state.currentPageId = basicsId;
  saveState();
}

      position.lineIndex,
      textObject.X(),
      textObject.Y()
    ));
    textObject.on('drag', sync);
    textObject.on('up', () => {
      sync();
      render(editor.value, currentPage()?.bbox, false);
    });
  }
}

function makeBoard(code, bbox, casAnalysis = null) {
  if (board) JXG.JSXGraph.freeBoard(board);
  board = JXG.JSXGraph.initBoard('board', { ...boardOptions, boundingbox: Array.isArray(bbox) ? bbox : DEFAULT_BBOX });
  board.jc.parse(code);
  const sourceTexts = board.objectsList.filter((element) =>
    element?.elType === 'text' && typeof element.X === 'function' && typeof element.Y === 'function'
  );
  if (casAnalysis) drawCasGraphs(board, casAnalysis.results, enabledCasKeys(), compile);
  board.on('update', updatePointReadback);
  board.on('boundingbox', rememberView);
  board.update();
  bindSimplePointSourceSync(code);
  bindSimpleTextSourceSync(code, sourceTexts);
  updatePointReadback();
}

function render(code, bbox, showErrors = true) {
  const casAnalysis = analyzeSource(code, ComputeEngine);
  renderCasResults(casAnalysis);
  try {
    validate(casAnalysis.jessieSource);
    makeBoard(casAnalysis.jessieSource, bbox, casAnalysis);
    const page = currentPage();
    if (page) { page.lastGoodSource = code; page.source = code; saveState(); }
    clearError();
    updateProgramLink();
    const casErrors = casAnalysis.results.filter((result) => result.error).length;
    setStatus(casErrors ? 'error' : 'ok', casErrors ? `${casErrors} CAS error${casErrors === 1 ? '' : 's'}` : 'saved');
    return true;
  } catch (err) {
    if (showErrors) {
      showError(err);
      console.error(err);
    }
    updateProgramLink();
    return false;
  }
}

function autocompleteActive() {
  return autocomplete.classList.contains('visible') && autocompleteItems.length > 0;
}

function deferError() {
  clearTimeout(renderTimer);
  clearError();
  setStatus('pending', 'typing…');
  renderTimer = setTimeout(() => render(editor.value, currentPage()?.bbox, true), ERROR_IDLE_MS);
}

function processEditorInput(event) {
  clearTimeout(renderTimer);
  rememberSource(editor.value);
  if (event?.inputType === 'insertFromPaste') hideAutocomplete();
  else updateAutocomplete();
  clearError();
  setStatus('pending', autocompleteActive() ? 'completing…' : 'checking…');
  renderTimer = setTimeout(() => {
    if (render(editor.value, currentPage()?.bbox, false)) return;
    deferError();
  }, INPUT_RENDER_MS);
}

function validateNow() {
  clearTimeout(renderTimer);
  render(editor.value, currentPage()?.bbox, true);
}

function showCurrentPage() {
  clearTimeout(renderTimer);
  hideAutocomplete();
  const page = currentPage();
  if (!page) return;
  editor.value = page.source || '';
  if (!render(editor.value, page.bbox) && page.lastGoodSource && page.lastGoodSource !== page.source) {
    try {
      const fallback = analyzeSource(page.lastGoodSource, ComputeEngine);
      makeBoard(fallback.jessieSource, page.bbox, fallback);
    } catch (err) { console.error(err); }
  }
  refreshPageControls();
}

function sourceSymbols() {
  const seen = new Set();
  const out = [];
  const re = /^\s*([A-Za-z_$][\w$]*)\s*=/gm;
  let match;
  while ((match = re.exec(editor.value)) !== null) {
    const label = match[1];
    if (seen.has(label)) continue;
    seen.add(label);
    out.push({ label, insert: label, kind: 'name' });
  }
  return out;
}

function tokenAtCaret() {
  if (editor.selectionStart !== editor.selectionEnd) return null;
  const caret = editor.selectionStart;
  const match = editor.value.slice(0, caret).match(/([A-Za-z_$][\w$]*)$/);
  if (!match) return null;
  return { text: match[1], start: caret - match[1].length, end: caret };
}

function hideAutocomplete() {
  autocomplete.classList.remove('visible');
  autocomplete.replaceChildren();
  autocompleteItems = [];
  autocompleteIndex = 0;
  autocompleteToken = null;
}

function drawAutocomplete() {
  autocomplete.replaceChildren();
  autocompleteItems.forEach((item, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `autocomplete-item${index === autocompleteIndex ? ' selected' : ''}`;
    button.setAttribute('role', 'option');
    button.setAttribute('aria-selected', index === autocompleteIndex ? 'true' : 'false');
    const name = document.createElement('span');
    name.className = 'autocomplete-name';
    name.textContent = item.label;
    const kind = document.createElement('span');
    kind.className = 'autocomplete-kind';
    kind.textContent = item.kind;
    button.append(name, kind);
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      acceptAutocomplete(index);
    });
    autocomplete.appendChild(button);
  });
  autocomplete.classList.toggle('visible', autocompleteItems.length > 0);
}

function updateAutocomplete(force = false) {
  if (document.activeElement !== editor) { hideAutocomplete(); return; }
  const token = tokenAtCaret();
  if (!token || (!force && token.text.length < 1)) { hideAutocomplete(); return; }
  const query = token.text.toLowerCase();
  const seen = new Set();
  const candidates = [...sourceSymbols(), ...AUTOCOMPLETE_WORDS]
    .filter((item) => {
      const key = item.label.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      if (force && !query) return true;
      if (!key.startsWith(query)) return false;
      return key !== query || item.insert !== item.label;
    })
    .slice(0, 7);
  autocompleteToken = token;
  autocompleteItems = candidates;
  autocompleteIndex = Math.min(autocompleteIndex, Math.max(0, candidates.length - 1));
  drawAutocomplete();
  if (candidates.length) {
    clearTimeout(renderTimer);
    clearError();
    setStatus('pending', 'completing…');
  }
}

function acceptAutocomplete(index = autocompleteIndex) {
  const item = autocompleteItems[index];
  const token = autocompleteToken;
  if (!item || !token) return;
  editor.setRangeText(item.insert, token.start, token.end, 'end');
  hideAutocomplete();
  editor.focus();
  editor.dispatchEvent(new Event('input', { bubbles: true }));
}

async function initialize() {
  if (new URLSearchParams(location.search).has('validate-builtins')) {
    validateAllBuiltinPages();
    return;
  }
  const hadState = loadState();
  if (!hadState) {
    let source = '// New construction\nA = point(-2, 0);\nB = point(2, 0);\nline(A, B);\n';
    try { const response = await fetch('./construction.jessie', { cache: 'no-store' }); if (response.ok) source = await response.text(); }
    catch (err) { console.warn(err); }
    const page = makePage('Page 1', source);
    state.pages = [page];
    state.currentPageId = page.id;
    saveState();
  }
  // Repair literal HTML entities in known captions, including edited saved copies.
  // Replace only the exact original line; keep all surrounding user edits.
  for (const page of state.pages) {
    if (!Array.isArray(page.casGraphs)) page.casGraphs = [];
    for (const fix of [{"key": "euclid-postulate-05", "before": "text(-9,-5.5,'Here α + β < 180°: the lines meet on the right.') <<display:'internal',fontSize:16>>;", "after": "text(-9,-5.5,'Here α + β < 180°: the lines meet on the right.') <<display:'html',fontSize:16>>;"}, {"key": "euclid-common-notion-05", "before": "text(-9,-4,'AB = AC + CB, with CB > 0; hence AB > AC.') <<display:'internal',fontSize:16>>;", "after": "text(-9,-4,'AB = AC + CB, with CB > 0; hence AB > AC.') <<display:'html',fontSize:16>>;"}]) {
      if (page.builtinKey !== fix.key) continue;
      for (const field of ['source', 'lastGoodSource']) {
        if (typeof page[field] === 'string') page[field] = page[field].split(fix.before).join(fix.after);
      }
    }
  }
  await installBuiltinExamples(!hadState);
  const linkedPage = linkedPageFromHash();
  if (linkedPage) {
    state.pages.push(linkedPage);
    state.currentPageId = linkedPage.id;
    saveState();
    consumeLinkedPageHash();
  }
  refreshPageControls();
  showCurrentPage();
}

function setSplitFromPointer(event) {
  const rect = layout.getBoundingClientRect();
  if (window.matchMedia('(max-width: 760px)').matches) {
    const height = Math.max(43, Math.min(rect.height, event.clientY - rect.top));
    document.documentElement.style.setProperty('--editor-height', `${height}px`);
    localStorage.setItem('jessiepage-editor-height', String(height));
  } else {
    const width = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
    document.documentElement.style.setProperty('--editor-width', `${width}px`);
    localStorage.setItem('jessiepage-editor-width', String(width));
  }
  if (board) board.updateContainerDims();
  positionCasConnectors();
}

async function toggleFullscreen(target) {
  try {
    const active = document.fullscreenElement || document.webkitFullscreenElement || null;
    if (active === target) {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      if (target.requestFullscreen) await target.requestFullscreen();
      else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      else throw new Error('Fullscreen is not supported by this browser');
    }
  } catch (err) { setStatus('error', 'fullscreen', err?.message || String(err)); }
}

function updateFullscreenButtons() {
  const active = document.fullscreenElement || document.webkitFullscreenElement || null;
  const pageFull = active === document.documentElement;
  const canvasFull = active === boardPane;
  fullscreenButton.textContent = pageFull ? '×' : '⛶';
  fullscreenButton.title = pageFull ? 'Exit fullscreen' : 'Enter fullscreen';
  canvasFullscreen.textContent = canvasFull ? '×' : '⛶';
  canvasFullscreen.title = canvasFull ? 'Exit canvas fullscreen' : 'Canvas fullscreen';
  setTimeout(() => { if (board) board.updateContainerDims(); }, 50);
}

splitter.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  splitter.classList.add('dragging');
  splitter.setPointerCapture(event.pointerId);
  const move = (e) => setSplitFromPointer(e);
  const stop = () => {
    splitter.classList.remove('dragging');
    splitter.removeEventListener('pointermove', move);
    splitter.removeEventListener('pointerup', stop);
    splitter.removeEventListener('pointercancel', stop);
  };
  splitter.addEventListener('pointermove', move);
  splitter.addEventListener('pointerup', stop);
  splitter.addEventListener('pointercancel', stop);
});

pageSelect.addEventListener('change', () => { rememberSource(editor.value); rememberView(); state.currentPageId = pageSelect.value; saveState(); showCurrentPage(); });
pageName.addEventListener('input', () => {
  const page = currentPage();
  if (!page) return;
  page.name = pageName.value || 'Untitled';
  saveState();
  const option = pageSelect.querySelector(`option[value="${CSS.escape(page.id)}"]`);
  if (option) option.textContent = page.name;
  updateProgramLink();
});
pageName.addEventListener('blur', () => {
  const page = currentPage();
  if (!page) return;
  page.name = pageName.value.trim() || 'Untitled';
  pageName.value = page.name;
  saveState();
  refreshPageControls();
});
addPage.addEventListener('click', () => {
  rememberSource(editor.value);
  rememberView();
  const page = makePage(nextPageName(), '// New construction\n');
  state.pages.push(page);
  state.currentPageId = page.id;
  saveState();
  showCurrentPage();
  pageName.focus();
  pageName.select();
});

fullscreenButton.addEventListener('click', () => toggleFullscreen(document.documentElement));
canvasFullscreen.addEventListener('click', () => toggleFullscreen(boardPane));
canvasZoomIn.addEventListener('click', () => { if (board) { board.zoomIn(); rememberView(); } });
canvasZoomOut.addEventListener('click', () => { if (board) { board.zoomOut(); rememberView(); } });
canvasReset.addEventListener('click', () => { if (board) { board.setBoundingBox(DEFAULT_BBOX, true); board.fullUpdate(); rememberView(); } });
document.addEventListener('fullscreenchange', updateFullscreenButtons);
document.addEventListener('webkitfullscreenchange', updateFullscreenButtons);

editor.addEventListener('input', processEditorInput);
editor.addEventListener('scroll', () => { positionErrorMarker(); syncCasResultsScroll(); positionCasConnectors(); });
window.addEventListener('resize', () => positionCasConnectors());
editor.addEventListener('click', () => updateAutocomplete());
editor.addEventListener('blur', () => setTimeout(() => {
  hideAutocomplete();
  validateNow();
}, 80));
editor.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.code === 'Space') {
    event.preventDefault();
    updateAutocomplete(true);
    return;
  }
  if (!autocomplete.classList.contains('visible')) return;
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    autocompleteIndex = (autocompleteIndex + 1) % autocompleteItems.length;
    drawAutocomplete();
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    autocompleteIndex = (autocompleteIndex - 1 + autocompleteItems.length) % autocompleteItems.length;
    drawAutocomplete();
  } else if (event.key === 'Tab' || event.key === 'Enter') {
    event.preventDefault();
    acceptAutocomplete();
  } else if (event.key === 'Escape') {
    event.preventDefault();
    hideAutocomplete();
    if (!render(editor.value, currentPage()?.bbox, false)) deferError();
  }
});

const savedWidth = Number(localStorage.getItem('jessiepage-editor-width'));
const savedHeight = Number(localStorage.getItem('jessiepage-editor-height'));
if (Number.isFinite(savedWidth) && savedWidth >= 0) document.documentElement.style.setProperty('--editor-width', `${savedWidth}px`);
if (Number.isFinite(savedHeight) && savedHeight >= 43) document.documentElement.style.setProperty('--editor-height', `${savedHeight}px`);

initialize();
  </script>
</body>
