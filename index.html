<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JessiePage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --panel: light-dark(#f6f7f9, #18191d);
      --panel2: light-dark(#fff, #111216);
      --border: light-dark(#d9dce2, #30333a);
      --muted: light-dark(#6c717c, #9da3af);
      --text: light-dark(#17191e, #eceef2);
      --accent: light-dark(#2563eb, #7da3ff);
      --error: light-dark(#c52a1d, #ff8a80);
      --errorbg: light-dark(rgb(197 42 29 / .10), rgb(255 138 128 / .13));
      --editor-width: 40vw;
      --editor-height: 46vh;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--panel2); color: var(--text); font-family: Inter, system-ui, sans-serif; }
    main { width: 100vw; height: 100dvh; display: grid; grid-template-columns: minmax(0, var(--editor-width)) 7px minmax(0, 1fr); }
    .editor-pane { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto minmax(0,1fr) auto auto; background: var(--panel); }
    .topline { height: 43px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-bottom: 1px solid var(--border); overflow: hidden; user-select: none; }
    .brand { flex: 0 0 auto; font-size: 13px; font-weight: 680; }
    #page-select, #page-name { height: 28px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel2); color: var(--text); font: 12px system-ui, sans-serif; outline: none; }
    #page-select { width: 92px; min-width: 70px; padding: 0 22px 0 7px; }
    #page-name { width: 130px; min-width: 70px; padding: 0 8px; }
    #page-select:focus, #page-name:focus { border-color: var(--accent); }
    .icon-button { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; padding: 0; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--muted); font: 18px/1 system-ui, sans-serif; cursor: pointer; }
    .fullscreen-button { display: none; }
    .top-link { flex: 0 0 auto; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .top-link:hover { color: var(--accent); text-decoration: underline; }
    #status { margin-left: auto; max-width: 32%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 11px ui-monospace, monospace; }
    #status.pending { color: var(--accent); }
    #status.error { color: var(--error); }
    .editor-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #error-line-marker { position: absolute; z-index: 0; left: 0; right: 0; display: none; background: var(--errorbg); border-left: 3px solid var(--error); pointer-events: none; }
    textarea { position: relative; z-index: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; resize: none; border: 0; outline: 0; padding: 16px 17px 24px; background: transparent; color: var(--text); caret-color: var(--accent); font: 14px/1.58 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
    .autocomplete { position: absolute; z-index: 10; left: 12px; bottom: 8px; width: min(290px, calc(100% - 24px)); max-height: 190px; overflow: auto; display: none; padding: 4px; border: 1px solid var(--border); border-radius: 9px; background: color-mix(in srgb, var(--panel2) 96%, transparent); box-shadow: 0 5px 18px rgb(0 0 0 / .16); }
    .autocomplete.visible { display: block; }
    .autocomplete-item { width: 100%; min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .autocomplete-item.selected { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .autocomplete-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 12px ui-monospace, monospace; }
    .autocomplete-kind { margin-left: auto; color: var(--muted); font-size: 10px; }
    .hint { min-height: 30px; padding: 7px 13px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; line-height: 1.35; user-select: none; }
    .hint.error { color: var(--error); background: var(--errorbg); }
    .point-readback { max-height: 128px; overflow: auto; padding: 8px 13px 10px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--panel2) 45%, transparent); }
    .point-readback .label { margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    #points { margin: 0; color: var(--muted); font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    .splitter { position: relative; z-index: 5; cursor: col-resize; background: var(--border); touch-action: none; }
    .splitter::after { content: ""; position: absolute; inset: 0 -5px; }
    .splitter:hover, .splitter.dragging { background: var(--accent); }
    .board-pane { position: relative; min-width: 0; min-height: 0; padding: 12px; background: var(--panel2); }
    .board-pane:fullscreen, .board-pane:-webkit-full-screen { width: 100%; height: 100%; padding: 8px; }
    #board { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; cursor: grab; touch-action: none; overscroll-behavior: contain; }
    #board:active { cursor: grabbing; }
    .canvas-tools { position: absolute; right: 20px; bottom: 20px; z-index: 20; display: flex; gap: 7px; }
    .canvas-tool { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid rgb(0 0 0 / .16); border-radius: 10px; background: rgb(255 255 255 / .94); color: #222; box-shadow: 0 1px 4px rgb(0 0 0 / .14); font: 600 22px/1 system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
    .canvas-tool.reset { width: 60px; font-size: 13px; }
    .canvas-tool.fullscreen { font-size: 21px; }
    #validator { position: fixed; left: -10000px; top: -10000px; width: 400px; height: 400px; opacity: 0; pointer-events: none; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(43px, var(--editor-height)) 7px minmax(0,1fr); }
      .editor-pane { grid-template-rows: auto minmax(0,1fr) auto; }
      .brand { display: none; }
      #page-select { width: 70px; min-width: 62px; }
      #page-name { flex: 1 1 auto; width: auto; min-width: 58px; }
      #status:not(.error) { display: none; }
      #status.error { margin-left: 0; max-width: 46px; }
      .fullscreen-button { display: grid; }
      .top-link { font-size: 10px; }
      .hint:not(.error), .point-readback { display: none; }
      .splitter { cursor: row-resize; }
      .splitter::after { inset: -5px 0; }
      .board-pane { padding: 8px; }
      #board { border-radius: 8px; }
      .canvas-tools { right: 16px; bottom: 16px; gap: 8px; }
      .canvas-tool { width: 48px; height: 48px; border-radius: 12px; font-size: 26px; }
      .canvas-tool.reset { width: 64px; font-size: 14px; }
      .canvas-tool.fullscreen { font-size: 23px; }
      .autocomplete-item { min-height: 40px; }
    }
  </style>
</head>
<body>
  <main id="layout">
    <section class="editor-pane">
      <div class="topline">
        <div class="brand">JessiePage</div>
        <select id="page-select" aria-label="Switch page"></select>
        <input id="page-name" type="text" maxlength="60" aria-label="Page name" title="Edit page name" />
        <button id="add-page" class="icon-button" title="New page" aria-label="New page">+</button>
        <button id="fullscreen-button" class="icon-button fullscreen-button" title="Enter fullscreen" aria-label="Enter fullscreen">⛶</button>
        <a id="program-link" class="top-link" href="#" target="_blank" rel="noopener noreferrer" title="Open this program as a new graph">Link ↗</a>
        <a class="top-link" href="https://jsxgraph.org/docs/symbols/JXG.JessieCode.html" target="_blank" rel="noopener noreferrer">Jessie ↗</a>
        <div id="status">loading…</div>
      </div>
      <div class="editor-wrap">
        <div id="error-line-marker" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" aria-label="JessieCode editor"></textarea>
        <div id="autocomplete" class="autocomplete" role="listbox" aria-label="Autocomplete suggestions"></div>
      </div>
      <div id="hint" class="hint">Autosaved locally · drag canvas to pan · use board controls or wheel/pinch to zoom · drag simple points to edit source</div>
      <div class="point-readback"><div class="label">Points</div><pre id="points">—</pre></div>
    </section>
    <div id="splitter" class="splitter" role="separator" aria-label="Resize editor and canvas"></div>
    <section class="board-pane" id="board-pane">
      <div id="board" class="jxgbox"></div>
      <div class="canvas-tools" aria-label="Canvas controls">
        <button id="canvas-zoom-in" class="canvas-tool" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="canvas-zoom-out" class="canvas-tool" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="canvas-reset" class="canvas-tool reset" title="Reset view" aria-label="Reset view">100%</button>
        <button id="canvas-fullscreen" class="canvas-tool fullscreen" title="Canvas fullscreen" aria-label="Canvas fullscreen">⛶</button>
      </div>
    </section>
  </main>
  <div id="validator" aria-hidden="true"></div>

  <script>
    const editor = document.getElementById('editor');
    const status = document.getElementById('status');
    const points = document.getElementById('points');
    const hint = document.getElementById('hint');
    const errorMarker = document.getElementById('error-line-marker');
    const autocomplete = document.getElementById('autocomplete');
    const layout = document.getElementById('layout');
    const splitter = document.getElementById('splitter');
    const pageSelect = document.getElementById('page-select');
    const pageName = document.getElementById('page-name');
    const addPage = document.getElementById('add-page');
    const fullscreenButton = document.getElementById('fullscreen-button');
    const programLink = document.getElementById('program-link');
    const boardPane = document.getElementById('board-pane');
    const canvasZoomIn = document.getElementById('canvas-zoom-in');
    const canvasZoomOut = document.getElementById('canvas-zoom-out');
    const canvasReset = document.getElementById('canvas-reset');
    const canvasFullscreen = document.getElementById('canvas-fullscreen');

    const STORAGE_KEY = 'jessiepage-state-v1';
    const DEFAULT_BBOX = [-6, 6, 6, -6];
    const NUMBER = String.raw`[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?`;
    const BUILTIN_EXAMPLES_VERSION = 2;
    const ERROR_IDLE_MS = 700;
    const AUTOCOMPLETE_WORDS = [
      ['point', 'point(', 'geometry'],
      ['line', 'line(', 'geometry'],
      ['segment', 'segment(', 'geometry'],
      ['circle', 'circle(', 'geometry'],
      ['polygon', 'polygon(', 'geometry'],
      ['midpoint', 'midpoint(', 'geometry'],
      ['intersection', 'intersection(', 'geometry'],
      ['perpendicular', 'perpendicular(', 'geometry'],
      ['circumcircle', 'circumcircle(', 'geometry'],
      ['glider', 'glider(', 'geometry'],
      ['tangent', 'tangent(', 'geometry'],
      ['slider', 'slider(', 'control'],
      ['functiongraph', 'functiongraph(', 'plot'],
      ['curve', 'curve(', 'plot'],
      ['map', 'map (x) -> ', 'language'],
      ['sin', 'sin(', 'math'],
      ['cos', 'cos(', 'math'],
      ['PI', 'PI', 'constant'],
      ['V', 'V(', 'value']
    ].map(([label, insert, kind]) => ({ label, insert, kind }));

    const BUILTIN_EXAMPLES = [
      { key: 'basics', name: 'Example · Basics', bbox: [-6,6,6,-6], source: `// Free points, lines, polygon, midpoint and circle.
A = point(-3, -1);
B = point(3, -1);
C = point(0, 3);
AB = segment(A, B);
BC = line(B, C) << dash: 2 >>;
tri = polygon(A, B, C) << fillColor: '#dbeafe', fillOpacity: 0.35 >>;
M = midpoint(A, B);
c = circle(M, C) << strokeColor: '#7c3aed' >>;` },
      { key: 'intersections', name: 'Example · Intersections', bbox: [-6,6,6,-6], source: `A = point(-2, 0);
B = point(2, 0);
c1 = circle(A, 3) << fillOpacity: 0.06 >>;
c2 = circle(B, 3) << fillOpacity: 0.06 >>;
P = intersection(c1, c2, 0);
Q = intersection(c1, c2, 1);
segment(A, B);
segment(P, Q) << dash: 2 >>;` },
      { key: 'glider', name: 'Example · Glider + tangent', bbox: [-6,6,6,-6], source: `O = point(0, 0);
R = point(3, 0);
c = circle(O, R);
P = glider(0, 3, c);
t = tangent(P);
segment(O, P) << dash: 2 >>;` },
      { key: 'functions', name: 'Example · Function plots', bbox: [-6,6,6,-6], source: `f = functiongraph('sin(x)') << strokeWidth: 3 >>;
g = functiongraph('0.25*x^2 - 2') << strokeColor: '#d97706' >>;
h = functiongraph('2*cos(x/2)') << strokeColor: '#7c3aed', dash: 2 >>;` },
      { key: 'slider', name: 'Example · Slider + function', bbox: [-6,6,6,-6], source: `a = slider([-4, -4], [2, -4], [-2, 1, 2]) << name: 'a' >>;
f = functiongraph(map (x) -> V(a) * sin(x)) << strokeWidth: 3 >>;` },
      { key: 'cardioid', name: 'Example · Parametric cardioid', bbox: [-6,6,6,-6], source: `fx = map (t) -> 2 * (1 - cos(t)) * cos(t);
fy = map (t) -> 2 * (1 - cos(t)) * sin(t);
c = curve(fx, fy, 0, 2 * PI) << strokeWidth: 3 >>;` },
      { key: 'loop', name: 'Example · Programming', bbox: [-6,6,6,-6], source: `for (i = 0; i < 9; i = i + 1) {
  point(i - 4, 2 * sin(i)) << name: '', withLabel: false >>;
}` }
    ];

    // Standalone JessieCode diagrams, installed once as editable local pages.
    BUILTIN_EXAMPLES.push(...[
  {
    "key": "euclid-i-01",
    "name": "Euclid I.1 · Construct an equilateral triangle",
    "bbox": [
      -9,
      9,
      13,
      -9
    ],
    "source": "// Euclid, Elements, Book I — JessieCode / JSXGraph 1.12.2\n// Original implementation, MIT license. Sources: github.com/jsxgraph/JessieCode and mathcs.clarku.edu/~djoyce/elements/bookI/bookI.html.\n// Blue points are inputs. Derived points follow their parents.\n// Coordinates implement the Euclidean plane; numerical checks are not proofs.\n// Avoid coincident inputs, collinear triangles, and zero/straight given angles.\n$board.setBoundingBox([-9, 9, 13, -9], true);\nnear = function(a,b) { return abs(a-b) < 0.000001*(1+abs(a)+abs(b));\n};\nlen = function(a,b) { return sqrt((X(a)-X(b))^2+(Y(a)-Y(b))^2);\n};\npt = function(x,y,n) { return point(x,y) <<name:n, size:3, strokeColor:'#245ea6', fillColor:'#245ea6'>>;\n};\ntri = function(a,b,c) { return polygon(a,b,c) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\n};\ncc = function(a,b) { return circle(a,b) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\n};\nreadout = function(y,label,f) { return text(-8,y,function(){return label+': '+round(f()*10000)/10000;}) <<display:'internal',fontSize:15>>;\n};\nmark = function(a,b,c,n) { return angle(a,b,c) <<name:n, radius:0.55, selection:'minor', fillColor:'#d99c46', fillOpacity:0.24, strokeColor:'#b47a2e', withLabel:true, label:<<display:'internal'>>>>;\n};\n// I.1: Construct an equilateral triangle\n// Both circles have radius AB. Their common point C gives AC=AB=BC.\npA=pt(-2,0,'A');\npB=pt(2,0,'B');\nc1=cc(pA,pB);\nc2=cc(pB,pA);\npC=intersection(c1,c2,0) <<name:'C'>>;\ntri(pA,pB,pC);\nmark(pB,pA,pC,'60°');\nmark(pA,pB,pC,'60°');\ncheck = function(){return near(len(pA,pB),len(pA,pC)) && near(len(pA,pB),len(pB,pC));};\nreadout(-5,'AB',function(){return len(pA,pB);});\nreadout(-6,'AC',function(){return len(pA,pC);});\ntext(-8,8,'I.1') <<display:'internal',fontSize:20>>;\ntext(-8,-8,function(){return check() ? '✓' : 'Degenerate or invalid inputs';}) <<display:'internal',fontSize:14>>;\n"
  },
  {
    "key": "euclid-i-02",
    "name": "Euclid I.2 · Transfer a segment to a given point",
    "bbox": [
      -9,
      9,
      13,
      -9
    ],
    "source": "// Euclid, Elements, Book I — JessieCode / JSXGraph 1.12.2\n// Original implementation, MIT license. Sources: github.com/jsxgraph/JessieCode and mathcs.clarku.edu/~djoyce/elements/bookI/bookI.html.\n// Blue points are inputs. Derived points follow their parents.\n// Coordinates implement the Euclidean plane; numerical checks are not proofs.\n// Avoid coincident inputs, collinear triangles, and zero/straight given angles.\n$board.setBoundingBox([-9, 9, 13, -9], true);\nnear = function(a,b) { return abs(a-b) < 0.000001*(1+abs(a)+abs(b));\n};\nlen = function(a,b) { return sqrt((X(a)-X(b))^2+(Y(a)-Y(b))^2);\n};\npt = function(x,y,n) { return point(x,y) <<name:n, size:3, strokeColor:'#245ea6', fillColor:'#245ea6'>>;\n};\ndp = function(f,g,n) { return point(f,g) <<name:n, size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\n};\nseg = function(a,b) { return segment(a,b) <<strokeWidth:2, strokeColor:'#34465d'>>;\n};\ntri = function(a,b,c) { return polygon(a,b,c) <<fillColor:'#548abd', fillOpacity:0.12, borders:<<strokeColor:'#34465d',strokeWidth:2>>>>;\n};\ncc = function(a,b) { return circle(a,b) <<strokeColor:'#9ba9b9',strokeWidth:1,dash:2>>;\n};\nalong = function(a,b,t,n) { return dp(function(){return X(a)+t()*(X(b)-X(a));},function(){return Y(a)+t()*(Y(b)-Y(a));},n);\n};\n// I.2: Transfer a segment to a given point\n// I.1 constructs DAB. Extend DB to G with BG=BC; extend DA to L with DL=DG. Subtract DA=DB to obtain AL=BC. Ray intersections are selected by directed distance.\npA=pt(-3,0,'A');\npB=pt(0,0,'B');\npC=pt(1,2,'C');\nseg(pB,pC);\nc1=cc(pA,pB);\nc2=cc(pB,pA);\npD=intersection(c1,c2,0) <<name:'D'>>;\npG=along(pD,pB,function(){return 1+len(pB,pC)/len(pD,pB);},'G');\ncc(pB,pC);\nseg(pD,pG);\npL=along(pD,pA,function(){return len(pD,pG)/len(pD,pA);},'L');\ncc(pD,pG);\nseg(pD,pL);\nseg(pA,pL);\ntri(pD,pA,pB);\ncheck = function(){return near(len(pA,pL),len(pB,pC));};\n\ntext(-8,8,'I.2') <<display:'internal',fontSize:20>>;\ntext(-8,-8,function(){return check() ? '✓' : 'Degenerate or invalid inputs';}) <<display:'internal',fontSize:14>>;\n"
  },
  {
    "key": "euclid-i-03",
    "name": "Euclid I.3 · Cut the shorter length from the longer",
    "bbox": [
      -9,
      9,
      13,
      -9
    ],
    "source": "// Euclid, Elements, Book I — JessieCode / JSXGraph 1.12.2\n// Original implementation, MIT license. Sources: github.com/jsxgraph/JessieCode and mathcs.clarku.edu/~djoyce/elements/bookI/bookI.html.\n// Blue points are inputs. Derived points follow their parents.\n// Coordinates implement the Euclidean plane; numerical checks are not proofs.\n// Avoid coincident inputs, collinear triangles, and zero/straight given angles.\n$board.setBoundingBox([-9, 9, 13, -9], true);\nnear = function(a,b) { return abs(a-b) < 0.000001*(1+abs(a)+abs(b));\n};\nlen = function(a,b) { return sqrt((X(a)-X(b))^2+(Y(a)-Y(b))^2);\n};\npt = function(x,y,n) { return point(x,y) <<name:n, size:3, strokeColor:'#245ea6', fillColor:'#245ea6'>>;\n};\ndp = function(f,g,n) { return point(f,g) <<name:n, size:2, strokeColor:'#b45b27', fillColor:'#b45b27'>>;\n};\nseg = function(a,b) { return segment(a,b) <<strokeWidth:2, strokeColor:'#34465d'>>;\n};\nalong = function(a,b,t,n) { return dp(function(){return X(a)+t()*(X(b)-X(a));},function(){return Y(a)+t()*(Y(b)-Y(a));},n);\n};\n// I.3: Cut the shorter length from the longer\n// Assume AB>CD. Transfer CD to A using I.2, then intersect the circle with ray AB. The computed directed intersection chooses the point on segment AB.\npA=pt(-3,1,'A');\npB=pt(3,1,'B');\npC=pt(-3,-2,'C');\npD=pt(-1,-1,'D');\nseg(pA,pB);\nseg(pC,pD);\npE=along(pA,pB,function(){return len(pC,pD)/len(pA,pB);},'E');\ncircle(pA,function(){return len(pC,pD);}) <<dash:2>>;\nseg(pA,pE);\ncheck = function(){return len(pA,pB)>len(pC,pD) && near(len(pA,pE),len(pC,pD));};\n\ntext(-8,8,'I.3') <<display:'internal',fontSize:20>>;\ntext(-8,-8,function(){return check() ? '✓' : 'Degenerate or invalid inputs';}) <<display:'internal',fontSize:14>>;\n"
  },
  {
    "key": "euclid-i-04",
    "name": "Euclid I.4 · Side-angle-side congruence",
    "bbox": [
      -9,
      9,
      13,

        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.pages) || !parsed.pages.length) return false;
        state = parsed;
        if (!state.pages.some((p) => p.id === state.currentPageId)) state.currentPageId = state.pages[0].id;
        return true;
      } catch (err) { console.warn(err); return false; }
    }

    function updateProgramLink() {
      const params = new URLSearchParams();
      params.set('new', '1');
      params.set('name', currentPage()?.name || 'Linked graph');
      params.set('code', editor.value || '');
      programLink.href = `${location.origin}${location.pathname}${location.search}#${params.toString()}`;
    }

    function linkedPageFromHash() {
      if (!location.hash || location.hash.length < 2) return null;
      const params = new URLSearchParams(location.hash.slice(1));
      if (params.get('new') !== '1' || !params.has('code')) return null;
      return makePage((params.get('name') || 'Linked graph').slice(0, 60), params.get('code') || '');
    }

    function consumeLinkedPageHash() { history.replaceState(null, '', `${location.pathname}${location.search}`); }

    function refreshPageControls() {
      pageSelect.replaceChildren();
      for (const page of state.pages) {
        const option = document.createElement('option');
        option.value = page.id;
        option.textContent = page.name;
        pageSelect.appendChild(option);
      }
      pageSelect.value = state.currentPageId;
      pageName.value = currentPage()?.name || '';
      updateProgramLink();
    }

    function nextPageName() {
      let n = 1;
      const used = new Set(state.pages.map((p) => p.name));
      while (used.has(`Page ${n}`)) n += 1;
      return `Page ${n}`;
    }

    function rememberSource(source) {
      const page = currentPage();
      if (!page) return;
      page.source = source;
      saveState();
      updateProgramLink();
    }

    function rememberView() {
      const page = currentPage();
      if (!page || !board) return;
      const bbox = board.getBoundingBox();
      if (Array.isArray(bbox) && bbox.length === 4 && bbox.every(Number.isFinite)) { page.bbox = bbox.slice(); saveState(); }
    }

    function validate(code) {
      let testBoard;
      try {
        testBoard = JXG.JSXGraph.initBoard('validator', { ...boardOptions, axis: false, pan: { enabled: false }, zoom: { enabled: false }, resize: { enabled: false } });
        testBoard.jc.parse(code);
        testBoard.update();
      } finally { if (testBoard) JXG.JSXGraph.freeBoard(testBoard); }
    }

    function installBuiltinExamples(selectBasics = false) {
      if ((state.builtinExamplesVersion || 0) >= BUILTIN_EXAMPLES_VERSION) return;
      const existing = new Set(state.pages.map((p) => p.builtinKey).filter(Boolean));
      let basicsId = null;
      for (const example of BUILTIN_EXAMPLES) {
        if (existing.has(example.key)) continue;
        try {
          validate(example.source);
          const page = makePage(example.name, example.source);
          page.builtinKey = example.key;
          page.bbox = example.bbox.slice();
          state.pages.push(page);
          if (example.key === 'basics') basicsId = page.id;
        } catch (err) { console.warn(`Skipping invalid built-in example ${example.key}`, err); }
      }
      state.builtinExamplesVersion = BUILTIN_EXAMPLES_VERSION;
      if (selectBasics && basicsId) state.currentPageId = basicsId;
      saveState();
    }

    function parseErrorLine(message) {
      const match = String(message).match(/Parse error on line\s+(\d+)/i);
      return match ? Number(match[1]) : null;
    }

    function positionErrorMarker() {
      if (!errorLine) { errorMarker.style.display = 'none'; return; }
      const style = getComputedStyle(editor);
      const lineHeight = Number.parseFloat(style.lineHeight) || 22;
      const top = (Number.parseFloat(style.paddingTop) || 0) + (errorLine - 1) * lineHeight - editor.scrollTop;
      errorMarker.style.height = `${lineHeight}px`;
      errorMarker.style.top = `${top}px`;
      errorMarker.style.display = (top + lineHeight < 0 || top > editor.clientHeight) ? 'none' : 'block';
    }

    function clearError() {
      errorLine = null;
      errorMarker.style.display = 'none';
      hint.className = 'hint';
      hint.textContent = 'Autosaved locally · drag canvas to pan · use board controls or wheel/pinch to zoom · drag simple points to edit source';
    }

    function showError(err) {
      const message = err?.message || String(err);
      errorLine = parseErrorLine(message);
      positionErrorMarker();
      hint.className = 'hint error';
      hint.textContent = errorLine ? `Line ${errorLine}: ${message.split('\n')[0]}` : message.split('\n')[0];
      setStatus('error', errorLine ? `line ${errorLine}` : 'error', message);
    }

    function formatNumber(value) { const clean = Math.abs(value) < 1e-12 ? 0 : value; return Number(clean.toFixed(6)).toString(); }
    function escapeRegex(value) { return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function simplePointNames(code) {
      const names = new Set();
      const assignment = new RegExp(String.raw`^\s*([A-Za-z_$][\w$]*)\s*=\s*point\s*\(\s*${NUMBER}\s*,\s*${NUMBER}\s*\)\s*;?(?:\s*\/\/.*)?\s*$`);
      for (const line of code.split('\n')) { const match = line.match(assignment); if (match) names.add(match[1]); }
      return names;
    }

    function syncSimplePointToSource(name, x, y) {
      const escapedName = escapeRegex(name);
      const assignment = new RegExp(String.raw`^(\s*${escapedName}\s*=\s*point\s*\(\s*)(${NUMBER})(\s*,\s*)(${NUMBER})(\s*\)\s*;?(?:\s*\/\/.*)?\s*)$`);
      const lines = editor.value.split('\n');
      for (let i = 0; i < lines.length; i += 1) {
        const match = lines[i].match(assignment);
        if (!match) continue;
        lines[i] = match[1] + formatNumber(x) + match[3] + formatNumber(y) + match[5];
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = lines.join('\n');
        editor.setSelectionRange(start, end);
        rememberSource(editor.value);
        return true;
      }
      return false;
    }

    function namedPoints() {
      if (!board) return [];
      return board.objectsList.filter((el) => el && el.elType === 'point' && el.name && typeof el.X === 'function' && typeof el.Y === 'function' && Number.isFinite(el.X()) && Number.isFinite(el.Y())).sort((a, b) => a.name.localeCompare(b.name));
    }

    function updatePointReadback() {
      const list = namedPoints();
      points.textContent = list.length ? list.map((p) => `${p.name} = (${formatNumber(p.X())}, ${formatNumber(p.Y())})`).join('\n') : 'No named points';
    }

    function bindSimplePointSourceSync(code) {
      const writable = simplePointNames(code);
      for (const point of namedPoints()) {
        if (!writable.has(point.name)) continue;
        point.on('drag', () => { syncSimplePointToSource(point.name, point.X(), point.Y()); updatePointReadback(); });
        point.on('up', () => { syncSimplePointToSource(point.name, point.X(), point.Y()); updatePointReadback(); });
      }
    }

    function makeBoard(code, bbox) {
      if (board) JXG.JSXGraph.freeBoard(board);
      board = JXG.JSXGraph.initBoard('board', { ...boardOptions, boundingbox: Array.isArray(bbox) ? bbox : DEFAULT_BBOX });
      board.jc.parse(code);
      board.on('update', updatePointReadback);
      board.on('boundingbox', rememberView);
      board.update();
      bindSimplePointSourceSync(code);
      updatePointReadback();
    }

    function render(code, bbox, showErrors = true) {
      try {
        validate(code);
        makeBoard(code, bbox);
        const page = currentPage();
        if (page) { page.lastGoodSource = code; page.source = code; saveState(); }
        clearError();
        updateProgramLink();
        setStatus('ok', 'saved');
        return true;
      } catch (err) {
        if (showErrors) {
          showError(err);
          console.error(err);
        }
        updateProgramLink();
        return false;
      }
    }

    function autocompleteActive() {
      return autocomplete.classList.contains('visible') && autocompleteItems.length > 0;
    }

    function deferError() {
      clearTimeout(renderTimer);
      clearError();
      setStatus('pending', 'typing…');
      renderTimer = setTimeout(() => render(editor.value, currentPage()?.bbox, true), ERROR_IDLE_MS);
    }

    function processEditorInput() {
      clearTimeout(renderTimer);
      rememberSource(editor.value);
      updateAutocomplete();
      if (autocompleteActive()) {
        clearError();
        setStatus('pending', 'completing…');
        return;
      }
      if (render(editor.value, currentPage()?.bbox, false)) return;
      deferError();
    }

    function validateNow() {
      clearTimeout(renderTimer);
      render(editor.value, currentPage()?.bbox, true);
    }

    function showCurrentPage() {
      clearTimeout(renderTimer);
      hideAutocomplete();
      const page = currentPage();
      if (!page) return;
      editor.value = page.source || '';
      if (!render(editor.value, page.bbox) && page.lastGoodSource && page.lastGoodSource !== page.source) {
        try { makeBoard(page.lastGoodSource, page.bbox); } catch (err) { console.error(err); }
      }
      refreshPageControls();
    }

    function sourceSymbols() {
      const seen = new Set();
      const out = [];
      const re = /^\s*([A-Za-z_$][\w$]*)\s*=/gm;
      let match;
      while ((match = re.exec(editor.value)) !== null) {
        const label = match[1];
        if (seen.has(label)) continue;
        seen.add(label);
        out.push({ label, insert: label, kind: 'name' });
      }
      return out;
    }

    function tokenAtCaret() {
      if (editor.selectionStart !== editor.selectionEnd) return null;
      const caret = editor.selectionStart;
      const match = editor.value.slice(0, caret).match(/([A-Za-z_$][\w$]*)$/);
      if (!match) return null;
      return { text: match[1], start: caret - match[1].length, end: caret };
    }

    function hideAutocomplete() {
      autocomplete.classList.remove('visible');
      autocomplete.replaceChildren();
      autocompleteItems = [];
      autocompleteIndex = 0;
      autocompleteToken = null;
    }

    function drawAutocomplete() {
      autocomplete.replaceChildren();
      autocompleteItems.forEach((item, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `autocomplete-item${index === autocompleteIndex ? ' selected' : ''}`;
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', index === autocompleteIndex ? 'true' : 'false');
        const name = document.createElement('span');
        name.className = 'autocomplete-name';
        name.textContent = item.label;
        const kind = document.createElement('span');
        kind.className = 'autocomplete-kind';
        kind.textContent = item.kind;
        button.append(name, kind);
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          acceptAutocomplete(index);
        });
        autocomplete.appendChild(button);
      });
      autocomplete.classList.toggle('visible', autocompleteItems.length > 0);
    }

    function updateAutocomplete(force = false) {
      if (document.activeElement !== editor) { hideAutocomplete(); return; }
      const token = tokenAtCaret();
      if (!token || (!force && token.text.length < 1)) { hideAutocomplete(); return; }
      const query = token.text.toLowerCase();
      const seen = new Set();
      const candidates = [...sourceSymbols(), ...AUTOCOMPLETE_WORDS]
        .filter((item) => {
          const key = item.label.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          if (force && !query) return true;
          if (!key.startsWith(query)) return false;
          return key !== query || item.insert !== item.label;
        })
        .slice(0, 7);
      autocompleteToken = token;
      autocompleteItems = candidates;
      autocompleteIndex = Math.min(autocompleteIndex, Math.max(0, candidates.length - 1));
      drawAutocomplete();
      if (candidates.length) {
        clearTimeout(renderTimer);
        clearError();
        setStatus('pending', 'completing…');
      }
    }

    function acceptAutocomplete(index = autocompleteIndex) {
      const item = autocompleteItems[index];
      const token = autocompleteToken;
      if (!item || !token) return;
      editor.setRangeText(item.insert, token.start, token.end, 'end');
      hideAutocomplete();
      editor.focus();
      editor.dispatchEvent(new Event('input', { bubbles: true }));
    }

    async function initialize() {
      const hadState = loadState();
      if (!hadState) {
        let source = '// New construction\nA = point(-2, 0);\nB = point(2, 0);\nline(A, B);\n';
        try { const response = await fetch('./construction.jessie', { cache: 'no-store' }); if (response.ok) source = await response.text(); }
        catch (err) { console.warn(err); }
        const page = makePage('Page 1', source);
        state.pages = [page];
        state.currentPageId = page.id;
        saveState();
      }
      installBuiltinExamples(!hadState);
      const linkedPage = linkedPageFromHash();
      if (linkedPage) {
        state.pages.push(linkedPage);
        state.currentPageId = linkedPage.id;
        saveState();
        consumeLinkedPageHash();
      }
      refreshPageControls();
      showCurrentPage();
    }

    function setSplitFromPointer(event) {
      const rect = layout.getBoundingClientRect();
      if (window.matchMedia('(max-width: 760px)').matches) {
        const height = Math.max(43, Math.min(rect.height, event.clientY - rect.top));
        document.documentElement.style.setProperty('--editor-height', `${height}px`);
        localStorage.setItem('jessiepage-editor-height', String(height));
      } else {
        const width = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
        document.documentElement.style.setProperty('--editor-width', `${width}px`);
        localStorage.setItem('jessiepage-editor-width', String(width));
      }
      if (board) board.updateContainerDims();
    }

    async function toggleFullscreen(target) {
      try {
        const active = document.fullscreenElement || document.webkitFullscreenElement || null;
        if (active === target) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          if (target.requestFullscreen) await target.requestFullscreen();
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
          else throw new Error('Fullscreen is not supported by this browser');
        }
      } catch (err) { setStatus('error', 'fullscreen', err?.message || String(err)); }
    }

    function updateFullscreenButtons() {
      const active = document.fullscreenElement || document.webkitFullscreenElement || null;
      const pageFull = active === document.documentElement;
      const canvasFull = active === boardPane;
      fullscreenButton.textContent = pageFull ? '×' : '⛶';
      fullscreenButton.title = pageFull ? 'Exit fullscreen' : 'Enter fullscreen';
      canvasFullscreen.textContent = canvasFull ? '×' : '⛶';
      canvasFullscreen.title = canvasFull ? 'Exit canvas fullscreen' : 'Canvas fullscreen';
      setTimeout(() => { if (board) board.updateContainerDims(); }, 50);
    }

    splitter.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      splitter.classList.add('dragging');
      splitter.setPointerCapture(event.pointerId);
      const move = (e) => setSplitFromPointer(e);
      const stop = () => {
        splitter.classList.remove('dragging');
        splitter.removeEventListener('pointermove', move);
        splitter.removeEventListener('pointerup', stop);
        splitter.removeEventListener('pointercancel', stop);
      };
      splitter.addEventListener('pointermove', move);
      splitter.addEventListener('pointerup', stop);
      splitter.addEventListener('pointercancel', stop);
    });

    pageSelect.addEventListener('change', () => { rememberSource(editor.value); rememberView(); state.currentPageId = pageSelect.value; saveState(); showCurrentPage(); });
    pageName.addEventListener('input', () => {
      const page = currentPage();
      if (!page) return;
      page.name = pageName.value || 'Untitled';
      saveState();
      const option = pageSelect.querySelector(`option[value="${CSS.escape(page.id)}"]`);
      if (option) option.textContent = page.name;
      updateProgramLink();
    });
    pageName.addEventListener('blur', () => {
      const page = currentPage();
      if (!page) return;
      page.name = pageName.value.trim() || 'Untitled';
      pageName.value = page.name;
      saveState();
      refreshPageControls();
    });
    addPage.addEventListener('click', () => {
      rememberSource(editor.value);
      rememberView();
      const page = makePage(nextPageName(), '// New construction\n');
      state.pages.push(page);
      state.currentPageId = page.id;
      saveState();
      showCurrentPage();
      pageName.focus();
      pageName.select();
    });

    fullscreenButton.addEventListener('click', () => toggleFullscreen(document.documentElement));
    canvasFullscreen.addEventListener('click', () => toggleFullscreen(boardPane));
    canvasZoomIn.addEventListener('click', () => { if (board) { board.zoomIn(); rememberView(); } });
    canvasZoomOut.addEventListener('click', () => { if (board) { board.zoomOut(); rememberView(); } });
    canvasReset.addEventListener('click', () => { if (board) { board.setBoundingBox(DEFAULT_BBOX, true); board.fullUpdate(); rememberView(); } });
    document.addEventListener('fullscreenchange', updateFullscreenButtons);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButtons);

    editor.addEventListener('input', processEditorInput);
    editor.addEventListener('scroll', positionErrorMarker);
    editor.addEventListener('click', () => updateAutocomplete());
    editor.addEventListener('blur', () => setTimeout(() => {
      hideAutocomplete();
      validateNow();
    }, 80));
    editor.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.code === 'Space') {
        event.preventDefault();
        updateAutocomplete(true);
        return;
      }
      if (!autocomplete.classList.contains('visible')) return;
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        autocompleteIndex = (autocompleteIndex + 1) % autocompleteItems.length;
        drawAutocomplete();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        autocompleteIndex = (autocompleteIndex - 1 + autocompleteItems.length) % autocompleteItems.length;
        drawAutocomplete();
      } else if (event.key === 'Tab' || event.key === 'Enter') {
        event.preventDefault();
        acceptAutocomplete();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        hideAutocomplete();
        if (!render(editor.value, currentPage()?.bbox, false)) deferError();
      }
    });

    const savedWidth = Number(localStorage.getItem('jessiepage-editor-width'));
    const savedHeight = Number(localStorage.getItem('jessiepage-editor-height'));
    if (Number.isFinite(savedWidth) && savedWidth >= 0) document.documentElement.style.setProperty('--editor-width', `${savedWidth}px`);
    if (Number.isFinite(savedHeight) && savedHeight >= 43) document.documentElement.style.setProperty('--editor-height', `${savedHeight}px`);

    initialize();
  </script>
</body>
</html>
